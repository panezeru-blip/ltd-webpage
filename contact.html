      <section class="page-content contact-card">
        <h1>Contact Me</h1>
        <p>Feel free to reach out for collaborations, questions, or just a hello.</p>

        <form action="#" method="post">
          <label for="name">Name</label>
          <input id="name" type="text" value="ZERUBBABEL" />

          <label for="email">Email</label>
          <input id="email" type="email" value="Panezeru@icloud.com" />

          <label for="phone">Phone</label>
          <input id="phone" type="tel" value="679478043" />

          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>

          <button class="btn" type="submit">Send message</button>
        </form>
      </section>
    </main>
